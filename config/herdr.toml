# Herdr config for Herdr.app. Symlinked to ~/.config/herdr/config.toml.
# Reference: https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
# Herdr has to receive the wheel to scroll a pane's history; without capture,
# the terminal turns scrolling into arrow keys (command history).
mouse_capture = true
# Spaces are one tab, split in two; tabs only show once there's a second.
hide_tab_bar_when_single_tab = true
# Room for "ARI-2308 #12380" under an indented worktree space.
sidebar_width = 32

# Herdr.app reports $status, e.g. "ARI-2308 #12380" (scripts/herdr-pr-status).
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$status"]]

# Herdr.app reports $space, e.g. "services/roadmap" (scripts/herdr-pr-status).
[ui.sidebar.agents]
rows = [["state_icon", "$space"], ["agent"]]

[ui.toast]
delivery = "terminal"

[keys]
previous_workspace = "cmd+["
next_workspace = "cmd+]"
cycle_pane_previous = "cmd+shift+["
cycle_pane_next = "cmd+shift+]"
switch_tab = "cmd+1..9"

[[keys.command]]
key = "cmd+n"
type = "popup"
command = "~/projects/github.com/revett/koba/scripts/herdr-new-space"
description = "new space (fresh worktree for git repos)"

[[keys.command]]
key = "cmd+w"
type = "popup"
command = "~/projects/github.com/revett/koba/scripts/herdr-close-space"
description = "close space (and its worktree, if it holds no work)"

[[keys.command]]
key = "cmd+shift+p"
type = "popup"
command = "~/projects/github.com/revett/koba/scripts/herdr-palette"
description = "command palette"

[[keys.command]]
key = "cmd+k"
type = "popup"
command = "~/projects/github.com/revett/koba/scripts/herdr-palette switch"
description = "switch space"

[[keys.command]]
key = "cmd+shift+/"
type = "popup"
command = "~/projects/github.com/revett/koba/scripts/herdr-keys"
description = "show these keybindings"
